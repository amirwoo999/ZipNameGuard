[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zipnameguard"
version = "0.1.0"
description = "Cross-platform release linter for ZIP filenames"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Amir"}]
keywords = ["zip", "portability", "windows", "cli", "release-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
zipnameguard = "zipnameguard.cli:main"

[project.optional-dependencies]
dev = ["ruff==0.14.3", "mypy==1.18.2", "build==1.3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
